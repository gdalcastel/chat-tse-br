[project]
name = "chatse"
version = "0.1.0"
description = "Consulta local da apuração presidencial de 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2"]

[project.scripts]
chatse = "chatse.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chatse*"]
